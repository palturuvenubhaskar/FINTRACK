<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PWA Icon Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: white; padding: 20px; max-width: 800px; margin: 0 auto; }
    canvas { border: 1px solid #333; margin-bottom: 10px; background: white; border-radius: 8px; }
    .btn { background: #E8B000; color: black; border: none; padding: 12px 24px; font-weight: 800; cursor: pointer; border-radius: 6px; font-size: 16px; margin-bottom: 20px; }
    .btn:hover { background: #d4a000; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
    .canvas-wrapper { display: flex; flexDirection: column; align-items: center; gap: 8px; }
    .label { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>Finance Tracker Icon Generator</h1>
  <p>Click the button below to generate and auto-download all required PWA icons.</p>
  <button class="btn" onclick="generateAll()">Generate & Download All Icons</button>
  <div class="grid" id="canvases"></div>

  <script>
    const SIZES = [72, 96, 128, 144, 152, 180, 192, 384, 512];
    const BG_COLOR = '#E8B000'; // App primary gold color

    function drawIcon(size, isMaskable = false) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = BG_COLOR;
      
      if (!isMaskable && size !== 180 && size !== 32 && size !== 16) { 
        // Rounded rect for non-maskable icons to look native
        const radius = size * 0.15;
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.quadraticCurveTo(size, 0, size, radius);
        ctx.lineTo(size, size - radius);
        ctx.quadraticCurveTo(size, size, size - radius, size);
        ctx.lineTo(radius, size);
        ctx.quadraticCurveTo(0, size, 0, size - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.fill();
      } else {
        // Full square for maskable, apple-touch, and favicons
        ctx.fillRect(0, 0, size, size); 
      }

      // Text Logo
      ctx.fillStyle = '#000000'; // Black text to contrast Gold
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.font = `900 ${size * 0.45}px system-ui, -apple-system, sans-serif`;
      ctx.fillText('FT', size / 2, size / 2 + (size * 0.05)); // Slight optical adjustment

      return canvas;
    }

    async function generateAll() {
      const container = document.getElementById('canvases');
      container.innerHTML = '';
      
      const delay = ms => new Promise(r => setTimeout(r, ms));

      for (const size of SIZES) {
        const canvas = drawIcon(size);
        const wrap = document.createElement('div');
        wrap.className = 'canvas-wrapper';
        wrap.innerHTML = `<div class="label">${size === 180 ? 'apple-touch-icon' : size + 'x' + size}</div>`;
        wrap.appendChild(canvas);
        container.appendChild(wrap);
        
        downloadCanvas(canvas, size === 180 ? 'apple-touch-icon.png' : `icon-${size}.png`);
        await delay(100); // browser buffer
      }

      // Maskable
      const maskable = drawIcon(512, true);
      const mWrap = document.createElement('div');
      mWrap.className = 'canvas-wrapper';
      mWrap.innerHTML = `<div class="label">maskable 512x512</div>`;
      mWrap.appendChild(maskable);
      container.appendChild(mWrap);
      downloadCanvas(maskable, 'icon-maskable-512.png');
      await delay(100);

      // Favicons
      const fav32 = drawIcon(32);
      const fav16 = drawIcon(16);
      downloadCanvas(fav32, 'favicon-32.png');
      await delay(100);
      downloadCanvas(fav16, 'favicon-16.png');
      
      alert('All icons generated and queued for download! Check your downloads folder, and move them to public/icons/.');
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url); // clean up
      }, 'image/png');
    }
  </script>
</body>
</html>
